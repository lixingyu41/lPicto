services:
  api:
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${LPICTO_VIDEO_GID:-44}"
      - "${LPICTO_RENDER_GID:-109}"
    environment:
      - FFMPEG_HWACCEL=auto
      - FFMPEG_HWACCEL_DEVICE=/dev/dri/renderD128
      - FFMPEG_HWACCEL_FALLBACK=true
      - LIBVA_DRIVER_NAME=${LIBVA_DRIVER_NAME:-iHD}
